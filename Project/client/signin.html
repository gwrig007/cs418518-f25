<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | ODU Course Advising Portal</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: linear-gradient(to bottom right, #f4f6fa, #e2e8f0);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h1 {
      color: #003366;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 20px;
    }

    button {
      background-color: #003366;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #00509e;
    }

    .link {
      margin-top: 15px;
      display: block;
      color: #007bff;
      text-decoration: none;
    }

    .link:hover {
      text-decoration: underline;
    }

    #signinMessage {
      margin-bottom: 15px;
      font-weight: 500;
      text-align: center;
      color: red;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome Back!</h1>
    <p>Sign in to access your ODU Course Advising Portal.</p>

    <form id="signinForm">
      <div id="signinMessage"></div>

      <input type="email" id="email" placeholder="Email address" required />
      <input type="password" id="password" placeholder="Password" required />

      <button type="submit">Sign In</button>

      <a href="forgot.html" class="link">Forgot Password?</a>
      <a href="signup.html" class="link">Don't have an account? Register here</a>
    </form>
  </div>

  <!-- ====== EXTERNAL SCRIPT ====== -->
  <script type="module" src="/src/js/signin.js"></script>
</body>
</html>
