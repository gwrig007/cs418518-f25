<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Profile | ODU Course Advising Portal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ====== GLOBAL ====== */
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      background-color: #f4f6fa;
      color: #333;
    }

    header {
      background-color: #003366; /* ODU Navy Blue */
      color: white;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header img {
      height: 45px;
    }

    header h1 {
      font-size: 1.5rem;
      margin: 0;
      font-weight: 600;
    }

    nav {
      background-color: #fefefe;
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 15px;
      border-bottom: 2px solid #e5e7eb;
      font-size: 1.1rem;
    }

    nav a {
      text-decoration: none;
      color: #003366;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover,
    nav a.active {
      color: #007bff;
    }

    /* ====== PROFILE CONTENT ====== */
    .content {
      max-width: 800px;
      margin: 60px auto;
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 20px;
      color: #003366;
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: 600;
      color: #003366;
      margin-bottom: 5px;
    }

    input {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
      width: 100%;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    input:focus {
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0, 123, 255, 0.3);
      outline: none;
    }

    button {
      background-color: #003366;
      color: white;
      padding: 12px 0;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #00509e;
    }

    .link {
      text-align: center;
      display: block;
      margin-top: 15px;
      color: #007bff;
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      color: #666;
      border-top: 1px solid #ddd;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <!-- ====== HEADER ====== -->
  <header>
    <div style="display: flex; align-items: center; gap: 15px;">
      <img src="https://upload.wikimedia.org/wikipedia/en/2/2d/Old_Dominion_Monarchs_logo.svg" alt="ODU Logo">
      <h1>ODU Course Advising Portal</h1>
    </div>
  </header>

  <!-- ====== NAVIGATION ====== -->
  <nav>
    <a href="home.html">Home</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>

  <!-- ====== MAIN CONTENT ====== -->
  <div class="content">
    <h2>Your Profile</h2>

    <form id="profileForm" class="profile-form">
      <label>First Name</label>
      <input type="text" id="firstName" name="firstName" placeholder="First Name" required />

      <label>Last Name</label>
      <input type="text" id="lastName" name="lastName" placeholder="Last Name" required />

      <label>Email (cannot change)</label>
      <input type="email" id="email" name="email" readonly />

      <label>Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required />

      <button type="submit">Save Changes</button>
      <a href="home.html" class="link">← Back to Home</a>
    </form>
  </div>

  <!-- ====== FOOTER ====== -->
  <footer>
    © 2025 Old Dominion University | Course Advising System
  </footer>

  <!-- ====== EXTERNAL SCRIPT ====== -->
  <script type="module" src="/src/js/profile.js"></script>
</body>
</html>
